<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening WhatsApp…</title>
  <style>body{font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0f172a;color:#fff}a{color:#4fd1c5}</style>
</head>
<body>
  <div id="msg">Opening WhatsApp…</div>
  <script>
    function redirectToUrl(u) {
      try {
        if (!u) return;
        // navigate the popup to WhatsApp URL
        window.location.href = u;
      } catch (e) {
        const msg = document.getElementById('msg');
        msg.innerHTML = 'Failed to open automatically. <a id="manual" href="#">Open WhatsApp</a>';
        document.getElementById('manual').onclick = function(){ window.location.href = u; };
      }
    }

    // Listen for message from opener containing { url }
    window.addEventListener('message', (ev) => {
      try {
        // accept same-origin messages only
        if (ev.origin !== window.location.origin) return;
        const data = ev.data || {};
        if (data.url) redirectToUrl(data.url);
      } catch (e) {}
    }, false);

    // If URL provided via query param ?u=..., decode and redirect
    (function(){
      const params = new URLSearchParams(window.location.search);
      const u = params.get('u');
      if (u) redirectToUrl(decodeURIComponent(u));
      // else wait for postMessage from opener
      setTimeout(() => {
        // after 5s, if still on this page, show manual instructions
        const msg = document.getElementById('msg');
        msg.innerHTML = 'If WhatsApp did not open, <a id="manual" href="#">tap here</a> to open it.';
        document.getElementById('manual').onclick = function(){ window.open('/', '_self'); };
      }, 5000);
    })();
  </script>
</body>
</html>
